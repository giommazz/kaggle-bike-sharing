# Hyperparameter search spaces for RandomizedSearchCV.
# Values should be lists (or distributions in future).

fe_modes:
  - no_fe # without feature engineering
  - fe # with feature engineering

models:
  rf:
    params:
      n_estimators: [300, 500]
      min_samples_leaf: [1, 2, 5]
      max_features: ["sqrt", 0.7]
      max_depth: [null, 12]

  hgbr:
    params:
      learning_rate: [0.05, 0.1]
      max_iter: [500, 800, 1000]
      max_leaf_nodes: [31, 63]
      min_samples_leaf: [10, 20]
      l2_regularization: [0.0, 0.5, 1.0]

  gbr:
    params:
      n_estimators: [300, 500]
      learning_rate: [0.05, 0.1]
      max_depth: [3, 4]
      alpha: [0.85, 0.9]
      subsample: [0.7, 0.9]

  xgb:
    params:
      max_depth: [4, 6]
      min_child_weight: [1, 5]
      subsample: [0.7, 0.9]
      colsample_bytree: [0.7, 0.9]
      reg_lambda: [0, 1]
      learning_rate: [0.05, 0.1]
      n_estimators: [400, 800]

  cbr:
    params:
      iterations: [600, 800]
      learning_rate: [0.03, 0.07]
      depth: [6, 8]
      l2_leaf_reg: [3, 10]

  lgbm:
    params:
      num_leaves: [31, 63, 127]
      min_child_samples: [5, 10, 20]
      feature_fraction: [0.7, 0.9]
      bagging_fraction: [0.7, 0.9]
      learning_rate: [0.05, 0.1]
      n_estimators: [600, 1000]
    params_no_log:
      tweedie_variance_power: [1.2, 1.5]
